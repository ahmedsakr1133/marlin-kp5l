name: Build Marlin Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out user repository
      uses: actions/checkout@v4
      with:
        path: config_repo

    - name: Clone Marlin Repository
      run: |
        git clone --depth 1 --branch bugfix-2.1.x https://github.com/MarlinFirmware/Marlin.git marlin_src

    - name: Copy Configuration Files
      run: |
        cp config_repo/Configuration.h marlin_src/Marlin/
        cp config_repo/Configuration_adv.h marlin_src/Marlin/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Run PlatformIO Build
      working-directory: ./marlin_src
      run: platformio run -e mks_robin_nano_v1_3

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Marlin-Firmware
        path: |
          marlin_src/.pio/build/**/*.bin
          marlin_src/.pio/build/**/*.hex
